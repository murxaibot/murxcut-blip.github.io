<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murx — Навигация</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ══════════ СБРОС ══════════ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Press Start 2P', cursive;
      min-height: 100vh;
      overflow-x: hidden;
      background: #f5c6d0;
      color: #fff;
    }

    /* ══════════ СКРОЛЛБАР ══════════ */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f5c6d0; }
    ::-webkit-scrollbar-thumb { background: #c48888; border: 2px solid #8b5e5e; }

    /* ══════════ ФОН ══════════ */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('background.png') center/cover no-repeat;
      filter: blur(6px) brightness(0.95);
    }

    .bg::after {
      content: '';
      position: fixed; inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 46px, rgba(255,255,255,.03) 46px, rgba(255,255,255,.03) 48px),
        repeating-linear-gradient(90deg, transparent, transparent 46px, rgba(255,255,255,.03) 46px, rgba(255,255,255,.03) 48px);
      pointer-events: none;
    }

    /* ══════════ КОНТЕЙНЕР ══════════ */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 20px 60px;
      display: flex;
      gap: 36px;
      align-items: center;
    }

    /* ══════════ ЛЕВАЯ КОЛОНКА ══════════ */
    .left { flex: 1; display: flex; flex-direction: column; gap: 14px; }

    /* ─── Кнопки ─── */
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(26,10,14,.88);
      border: 4px solid #8b5e5e;
      outline: 3px solid rgba(42,26,26,.7);
      text-decoration: none;
      cursor: pointer;
      transition: .2s;
    }
    .nav-btn:nth-child(even) { margin-left: 28px; }

    .nav-btn:hover {
      transform: scale(1.04);
      border-color: #d4a0a0;
      box-shadow: 0 0 18px rgba(255,150,180,.45), inset 0 0 12px rgba(255,150,180,.1);
    }
    .nav-btn:active { transform: scale(.97); }

    .btn-icon {
      font-size: 26px;
      min-width: 36px;
      text-align: center;
      filter: drop-shadow(0 0 3px rgba(255,255,255,.25));
    }
    .btn-text { display: flex; flex-direction: column; gap: 7px; }
    .btn-title {
      font-size: 10px;
      color: #ffd700;
      text-shadow: 2px 2px 0 rgba(0,0,0,.5);
      line-height: 1.5;
    }
    .btn-sub {
      font-size: 7px;
      color: #ddd0d0;
      text-shadow: 1px 1px 0 rgba(0,0,0,.5);
      line-height: 1.5;
    }

    /* ─── Coming Soon ─── */
    .coming-soon {
      margin-top: 18px;
      padding: 22px;
      background: rgba(255,220,230,.35);
      border: 4px solid #c48888;
      text-align: center;
    }
    .coming-soon h2 {
      font-size: 18px;
      color: #2a1a1a;
      text-shadow: 1px 1px 0 rgba(255,255,255,.25);
      margin-bottom: 10px;
    }
    .coming-soon p {
      font-size: 7px;
      color: #4a2a2a;
      line-height: 1.8;
    }

    .pig {
      margin-top: 14px;
      font-size: 44px;
      animation: pigBob 2s ease-in-out infinite;
    }
    @keyframes pigBob {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-8px); }
    }

    .grass-row { display: flex; justify-content: center; margin-top: 8px; }
    .g-block {
      width: 22px; height: 22px;
      background: #8B5E3C;
      border: 2px solid #6b4226;
      position: relative;
    }
    .g-block::before {
      content: '';
      position: absolute; top: -2px; left: -2px;
      width: calc(100% + 4px); height: 8px;
      background: #4CAF50;
      border: 2px solid #388E3C;
      border-bottom: none;
    }

    /* ══════════ ПРАВАЯ КОЛОНКА — ПЕРСОНАЖ ══════════ */
    .right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .character {
      width: 100%;
      max-width: 420px;
    }
    .character img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }

    /* ══════════ ДЕКОРАЦИИ: БЛОКИ ══════════ */
    .mc {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      opacity: .45;
      image-rendering: pixelated;
    }
    .mc.grass {
      width: 36px; height: 36px;
      background: #8B5E3C;
      border: 2px solid #6b4226;
    }
    .mc.grass::before {
      content: '';
      position: absolute; top: -2px; left: -2px;
      width: calc(100% + 4px); height: 10px;
      background: #4CAF50;
      border: 2px solid #388E3C; border-bottom: none;
    }
    .mc.wool {
      width: 32px; height: 32px;
      background: #f8a8c0;
      border: 2px solid #d08098;
    }
    .mc.log {
      width: 30px; height: 30px;
      background: #6d4c2e;
      border: 2px solid #503520;
    }
    .mc.cherry {
      width: 34px; height: 34px;
      background: #ffb6c1;
      border: 2px solid #f090a0;
    }

    .mc.d1 { top: 6%;    left: 3%;   animation: float 3.5s ease-in-out infinite; }
    .mc.d2 { top: 22%;   right: 4%;  animation: float 4s ease-in-out infinite .5s; }
    .mc.d3 { bottom: 8%; left: 5%;   animation: float 3s ease-in-out infinite 1s; }
    .mc.d4 { bottom: 18%;right: 6%;  animation: float 4.5s ease-in-out infinite 1.5s; }
    .mc.d5 { top: 50%;   left: 1%;   animation: float 3.8s ease-in-out infinite .8s; }
    .mc.d6 { top: 72%;   right: 2%;  animation: float 3.2s ease-in-out infinite 1.2s; }
    .mc.d7 { top: 88%;   left: 8%;   animation: float 4.2s ease-in-out infinite 2s; }
    .mc.d8 { top: 38%;   right: 3%;  animation: float 3.6s ease-in-out infinite .3s; }

    @keyframes float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%     { transform: translateY(-10px) rotate(3deg); }
    }

    /* ══════════ ЭМОДЗИ ══════════ */
    .emo {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      opacity: .45;
      font-size: 18px;
    }
    .emo.e1 { top: 10%;   right: 14%; animation: float 3s ease-in-out infinite .2s; }
    .emo.e2 { top: 35%;   left: 6%;   animation: float 4s ease-in-out infinite .7s; font-size: 14px; }
    .emo.e3 { top: 58%;   right: 10%; animation: float 3.4s ease-in-out infinite 1.4s; }
    .emo.e4 { top: 82%;   left: 12%;  animation: float 3.8s ease-in-out infinite .4s; font-size: 16px; }
    .emo.e5 { top: 14%;   left: 42%;  animation: float 4.2s ease-in-out infinite 1.8s; font-size: 14px; }
    .emo.e6 { bottom: 4%; right: 20%; animation: float 3.6s ease-in-out infinite 1s; }

    /* ══════════ ЛЕПЕСТКИ ══════════ */
    .petal {
      position: fixed;
      width: 8px; height: 8px;
      background: #ffb6c1;
      z-index: 0; pointer-events: none;
      opacity: .55;
      animation: petals linear infinite;
    }
    .petal:nth-child(1)  { left: 8%;  animation-duration: 9s;   animation-delay: 0s;   width: 6px; height: 6px; }
    .petal:nth-child(2)  { left: 22%; animation-duration: 11s;  animation-delay: 2s;   width: 10px; height: 10px; opacity: .35; }
    .petal:nth-child(3)  { left: 38%; animation-duration: 8s;   animation-delay: 4s; }
    .petal:nth-child(4)  { left: 52%; animation-duration: 10s;  animation-delay: 1s;   width: 6px; height: 6px; }
    .petal:nth-child(5)  { left: 68%; animation-duration: 12s;  animation-delay: 3s;   opacity: .4; }
    .petal:nth-child(6)  { left: 82%; animation-duration: 9s;   animation-delay: 5s;   width: 10px; height: 10px; }
    .petal:nth-child(7)  { left: 14%; animation-duration: 13s;  animation-delay: 6s;   opacity: .3; }
    .petal:nth-child(8)  { left: 58%; animation-duration: 10s;  animation-delay: 2.5s; width: 7px; height: 7px; }
    .petal:nth-child(9)  { left: 92%; animation-duration: 11s;  animation-delay: 4.5s; opacity: .4; }
    .petal:nth-child(10) { left: 45%; animation-duration: 9.5s; animation-delay: 1.5s; }
    .petal:nth-child(11) { left: 75%; animation-duration: 8.5s; animation-delay: 3.5s; width: 5px; height: 5px; }
    .petal:nth-child(12) { left: 30%; animation-duration: 12s;  animation-delay: 0.5s; opacity: .3; width: 9px; height: 9px; }

    @keyframes petals {
      0%   { top: -12px; transform: rotate(0)    translateX(0); }
      25%  { transform: rotate(90deg)  translateX(22px); }
      50%  { transform: rotate(180deg) translateX(-18px); }
      75%  { transform: rotate(270deg) translateX(12px); }
      100% { top: 105vh; transform: rotate(360deg) translateX(0); }
    }

    /* ══════════ ИСКОРКИ ══════════ */
    .spark {
      position: fixed;
      width: 4px; height: 4px;
      background: #fff;
      z-index: 0; pointer-events: none;
      animation: sparkAnim 2.2s ease-in-out infinite;
    }
    .spark.s1 { top: 7%;  left: 18%;  animation-delay: 0s; }
    .spark.s2 { top: 24%; right: 22%; animation-delay: .6s; }
    .spark.s3 { top: 44%; left: 50%;  animation-delay: 1.1s; }
    .spark.s4 { top: 62%; right: 30%; animation-delay: 1.6s; }
    .spark.s5 { top: 78%; left: 30%;  animation-delay: .3s; }
    .spark.s6 { top: 90%; right: 12%; animation-delay: .9s; }
    .spark.s7 { top: 15%; left: 60%;  animation-delay: 1.4s; }
    .spark.s8 { top: 52%; right: 8%;  animation-delay: 2s; }

    @keyframes sparkAnim {
      0%,100% { opacity: 0; transform: scale(0); }
      50%     { opacity: .9; transform: scale(1.2); }
    }

    /* ══════════ ПОЛОСА ТРАВЫ ══════════ */
    .ground {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%; height: 36px;
      z-index: 0; pointer-events: none;
      display: flex;
      overflow: hidden;
      opacity: .3;
    }
    .ground-block {
      min-width: 36px; height: 36px;
      background: #8B5E3C;
      border: 2px solid #6b4226;
      position: relative; flex-shrink: 0;
    }
    .ground-block::before {
      content: '';
      position: absolute; top: -2px; left: -2px;
      width: calc(100% + 4px); height: 10px;
      background: #4CAF50;
      border: 2px solid #388E3C; border-bottom: none;
    }

    /* ══════════ АНИМАЦИИ ПОЯВЛЕНИЯ ══════════ */
    .nav-btn { opacity: 0; transform: translateX(-30px); animation: slideIn .5s ease forwards; }
    .nav-btn:nth-child(1) { animation-delay: .1s; }
    .nav-btn:nth-child(2) { animation-delay: .2s; }
    .nav-btn:nth-child(3) { animation-delay: .3s; }
    .nav-btn:nth-child(4) { animation-delay: .4s; }
    .nav-btn:nth-child(5) { animation-delay: .5s; }

    .character    { opacity: 0; animation: fadeIn .8s ease forwards .3s; }
    .coming-soon  { opacity: 0; animation: fadeIn .6s ease forwards .7s; }

    @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
    @keyframes fadeIn  { to { opacity: 1; } }

    /* ══════════ ФУТЕР ══════════ */
    .footer {
      position: relative; z-index: 1;
      text-align: center;
      padding: 18px;
      font-size: 7px;
      color: #8b5e5e;
      opacity: .7;
    }

    /* ══════════ АДАПТИВ ══════════ */
    @media (max-width: 800px) {
      .container { flex-direction: column-reverse; gap: 24px; padding: 20px 14px 70px; }
      .left, .right { width: 100%; }
      .nav-btn:nth-child(even) { margin-left: 18px; }
      .btn-title { font-size: 9px; }
      .btn-sub   { font-size: 6px; }
      .coming-soon h2 { font-size: 15px; }
      .mc { opacity: .25; }
      .ground { opacity: .18; }
      .character { max-width: 300px; margin: 0 auto; }
    }
    @media (max-width: 480px) {
      .nav-btn { padding: 11px 12px; gap: 10px; }
      .nav-btn:nth-child(even) { margin-left: 10px; }
      .btn-icon  { font-size: 20px; min-width: 28px; }
      .btn-title { font-size: 8px; }
      .btn-sub   { font-size: 6px; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="petal"></div><div class="petal"></div><div class="petal"></div>
  <div class="petal"></div><div class="petal"></div><div class="petal"></div>
  <div class="petal"></div><div class="petal"></div><div class="petal"></div>
  <div class="petal"></div><div class="petal"></div><div class="petal"></div>

  <div class="spark s1"></div><div class="spark s2"></div>
  <div class="spark s3"></div><div class="spark s4"></div>
  <div class="spark s5"></div><div class="spark s6"></div>
  <div class="spark s7"></div><div class="spark s8"></div>

  <div class="mc grass  d1"></div>
  <div class="mc wool   d2"></div>
  <div class="mc cherry d3"></div>
  <div class="mc grass  d4"></div>
  <div class="mc log    d5"></div>
  <div class="mc wool   d6"></div>
  <div class="mc cherry d7"></div>
  <div class="mc grass  d8"></div>

  <div class="emo e1">💗</div>
  <div class="emo e2">🎀</div>
  <div class="emo e3">🌸</div>
  <div class="emo e4">✨</div>
  <div class="emo e5">💮</div>
  <div class="emo e6">🌷</div>

  <div class="ground" id="ground"></div>

  <!-- ═══ КОНТЕНТ ═══ -->
  <div class="container">

    <!-- ── Кнопки слева ── -->
    <div class="left">

      <a href="https://t.me/ТВОЙ_КАНАЛ" class="nav-btn" target="_blank">
        <span class="btn-icon">🌱</span>
        <div class="btn-text">
          <span class="btn-title">Мой телеграм канал</span>
          <span class="btn-sub">тут вы найдете весь контент</span>
        </div>
      </a>

      <a href="#" class="nav-btn">
        <span class="btn-icon">🍰</span>
        <div class="btn-text">
          <span class="btn-title">Мои боты</span>
          <span class="btn-sub">тут вы найдете всех ботов</span>
        </div>
      </a>

      <a href="#" class="nav-btn">
        <span class="btn-icon">🎂</span>
        <div class="btn-text">
          <span class="btn-title">Мои промты</span>
          <span class="btn-sub">серии промтов и рандом</span>
        </div>
      </a>

      <a href="#" class="nav-btn">
        <span class="btn-icon">💎</span>
        <div class="btn-text">
          <span class="btn-title">Заказ бота</span>
          <span class="btn-sub">информация о заказе</span>
        </div>
      </a>

      <a href="#" class="nav-btn">
        <span class="btn-icon">🌸</span>
        <div class="btn-text">
          <span class="btn-title">Общая информация</span>
          <span class="btn-sub">то, чем я пользуюсь</span>
        </div>
      </a>

      <div class="coming-soon">
        <h2>Coming soon</h2>
        <p>в будущем информация<br>будет добавляться</p>
        <div class="pig">🐷</div>
        <div class="grass-row">
          <div class="g-block"></div><div class="g-block"></div>
          <div class="g-block"></div><div class="g-block"></div>
          <div class="g-block"></div><div class="g-block"></div>
        </div>
      </div>
    </div>

    <!-- ── Персонаж справа по центру ── -->
    <div class="right">
      <div class="character">
        <img src="murx.png" alt="Murx">
      </div>
    </div>

  </div>

  <div class="footer">made with 💗 by Murx</div>

  <script>
    const g = document.getElementById('ground');
    const count = Math.ceil(window.innerWidth / 36) + 2;
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'ground-block';
      g.appendChild(b);
    }
  </script>
</body>
</html>
