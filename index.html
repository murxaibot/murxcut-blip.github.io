<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murx — Навигация</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ══════════ СБРОС ══════════ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Press Start 2P', cursive;
      min-height: 100vh;
      overflow-x: hidden;
      background: #f5c6d0;
      color: #fff;
    }

    /* ══════════ КАСТОМНЫЙ СКРОЛЛБАР ══════════ */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f5c6d0; }
    ::-webkit-scrollbar-thumb { background: #c48888; border: 2px solid #8b5e5e; }

    /* ══════════ ФОН ══════════ */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      /* ▼ Замени на свой скриншот Minecraft-комнаты ▼ */
      /* background: url('bg.png') center/cover no-repeat; */
      /* filter: blur(6px) brightness(0.95); */
      background:
        radial-gradient(ellipse at 20% 40%, rgba(245,198,208,.9), transparent 60%),
        radial-gradient(ellipse at 80% 30%, rgba(232,196,168,.8), transparent 55%),
        radial-gradient(ellipse at 60% 85%, rgba(240,180,200,.6), transparent 50%),
        linear-gradient(145deg, #f5c6d0, #e8c4a8, #f0b8c4, #f2d1b8);
    }

    /* Пиксельная сетка поверх фона */
    .bg::after {
      content: '';
      position: fixed; inset: 0;
      background:
        repeating-linear-gradient(0deg,   transparent, transparent 46px, rgba(255,255,255,.03) 46px, rgba(255,255,255,.03) 48px),
        repeating-linear-gradient(90deg,  transparent, transparent 46px, rgba(255,255,255,.03) 46px, rgba(255,255,255,.03) 48px);
      pointer-events: none;
    }

    /* ══════════ КОНТЕЙНЕР ══════════ */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 20px 60px;
      display: flex;
      gap: 36px;
      align-items: flex-start;
    }

    /* ══════════ ЛЕВАЯ КОЛОНКА ══════════ */
    .left { flex: 1; display: flex; flex-direction: column; gap: 14px; }

    /* ─── Кнопки навигации ─── */
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(26,10,14,.88);
      border: 4px solid #8b5e5e;
      outline: 3px solid rgba(42,26,26,.7);
      text-decoration: none;
      cursor: pointer;
      transition: .2s;
      position: relative;
    }
    .nav-btn:nth-child(even) { margin-left: 28px; }

    .nav-btn:hover {
      transform: scale(1.04);
      border-color: #d4a0a0;
      box-shadow: 0 0 18px rgba(255,150,180,.45), inset 0 0 12px rgba(255,150,180,.1);
    }
    .nav-btn:active { transform: scale(.97); }

    .btn-icon {
      font-size: 26px;
      min-width: 36px;
      text-align: center;
      filter: drop-shadow(0 0 3px rgba(255,255,255,.25));
    }
    .btn-text { display: flex; flex-direction: column; gap: 7px; }
    .btn-title {
      font-size: 10px;
      color: #ffd700;
      text-shadow: 2px 2px 0 rgba(0,0,0,.5);
      line-height: 1.5;
    }
    .btn-sub {
      font-size: 7px;
      color: #ddd0d0;
      text-shadow: 1px 1px 0 rgba(0,0,0,.5);
      line-height: 1.5;
    }

    /* ─── Coming Soon ─── */
    .coming-soon {
      margin-top: 18px;
      padding: 22px;
      background: rgba(255,220,230,.35);
      border: 4px solid #c48888;
      text-align: center;
    }
    .coming-soon h2 {
      font-size: 18px;
      color: #2a1a1a;
      text-shadow: 1px 1px 0 rgba(255,255,255,.25);
      margin-bottom: 10px;
    }
    .coming-soon p {
      font-size: 7px;
      color: #4a2a2a;
      line-height: 1.8;
    }

    .pig {
      margin-top: 14px;
      font-size: 44px;
      animation: pigBob 2s ease-in-out infinite;
    }
    @keyframes pigBob {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-8px); }
    }

    /* Полоска травы */
    .grass-row { display: flex; justify-content: center; margin-top: 8px; }
    .g-block {
      width: 22px; height: 22px;
      background: #8B5E3C;
      border: 2px solid #6b4226;
      position: relative;
    }
    .g-block::before {
      content: '';
      position: absolute; top: -2px; left: -2px;
      width: calc(100% + 4px); height: 8px;
      background: #4CAF50;
      border: 2px solid #388E3C;
      border-bottom: none;
    }

    /* ══════════ ПРАВАЯ КОЛОНКА ══════════ */
    .right { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; }

    /* ─── Облачко ─── */
    .bubble {
      background: rgba(255,240,245,.93);
      border: 4px solid #d4a0a0;
      outline: 3px solid #8b5e5e;
      padding: 22px 24px;
      max-width: 400px; width: 100%;
      position: relative;
    }
    /* Хвостик */
    .bubble::after {
      content: '';
      position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
      border: 14px solid transparent;
      border-top: 18px solid #d4a0a0;
    }
    .bubble::before {
      content: '';
      position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
      border: 10px solid transparent;
      border-top: 14px solid rgba(255,240,245,.93);
      z-index: 1;
    }
    .bubble p {
      font-size: 8px; color: #2a1a1a;
      line-height: 2.2; text-shadow: none;
    }
    .bubble .name { color: #c0392b; font-size: 10px; }

    /* ─── Персонаж ─── */
    .character { width: 100%; max-width: 380px; margin-top: 18px; }
    .character img { width: 100%; height: auto; display: block; border-radius: 6px; }

    /* Заглушка, если картинки пока нет */
    .char-placeholder {
      width: 100%; height: 380px;
      background: rgba(255,220,230,.25);
      border: 4px dashed #d4a0a0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      font-size: 9px; color: #8b5e5e;
      text-align: center; padding: 20px; line-height: 2.2;
    }

    /* ══════════ ДЕКОРАЦИИ: MINECRAFT-БЛОКИ ══════════ */
    .mc {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      opacity: .45;
      image-rendering: pixelated;
    }
    /* Блок травы */
    .mc.grass {
      width: 36px; height: 36px;
      background: #8B5E3C;
      border: 2px solid #6b4226;
    }
    .mc.grass::before {
      content: '';
      position: absolute; top: -2px; left: -2px;
      width: calc(100% + 4px); height: 10px;
      background: #4CAF50;
      border: 2px solid #388E3C; border-bottom: none;
    }
    /* Розовая шерсть */
    .mc.wool {
      width: 32px; height: 32px;
      background: #f8a8c0;
      border: 2px solid #d08098;
    }
    /* Бревно */
    .mc.log {
      width: 30px; height: 30px;
      background: #6d4c2e;
      border: 2px solid #503520;
    }
    /* Листва вишни */
    .mc.cherry {
      width: 34px; height: 34px;
      background: #ffb6c1;
      border: 2px solid #f090a0;
    }

    /* Расположение */
    .mc.d1 { top: 6%;   left: 3%;   animation: float 3.5s ease-in-out infinite; }
    .mc.d2 { top: 22%;  right: 4%;  animation: float 4s ease-in-out infinite .5s; }
    .mc.d3 { bottom: 8%; left: 5%;  animation: float 3s ease-in-out infinite 1s; }
    .mc.d4 { bottom: 18%;right: 6%; animation: float 4.5s ease-in-out infinite 1.5s; }
    .mc.d5 { top: 50%;  left: 1%;   animation: float 3.8s ease-in-out infinite .8s; }
    .mc.d6 { top: 72%;  right: 2%;  animation: float 3.2s ease-in-out infinite 1.2s; }
    .mc.d7 { top: 88%;  left: 8%;   animation: float 4.2s ease-in-out infinite 2s; }
    .mc.d8 { top: 38%;  right: 3%;  animation: float 3.6s ease-in-out infinite .3s; }

    @keyframes float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%     { transform: translateY(-10px) rotate(3deg); }
    }

    /* ══════════ ДЕКОРАЦИИ: ЭМОДЗИ ══════════ */
    .emo {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      opacity: .45;
      font-size: 18px;
    }
    .emo.e1 { top: 10%;  right: 14%; animation: float 3s ease-in-out infinite .2s; }
    .emo.e2 { top: 35%;  left: 6%;   animation: float 4s ease-in-out infinite .7s; font-size: 14px; }
    .emo.e3 { top: 58%;  right: 10%; animation: float 3.4s ease-in-out infinite 1.4s; }
    .emo.e4 { top: 82%;  left: 12%;  animation: float 3.8s ease-in-out infinite .4s; font-size: 16px; }
    .emo.e5 { top: 14%;  left: 42%;  animation: float 4.2s ease-in-out infinite 1.8s; font-size: 14px; }
    .emo.e6 { bottom: 4%; right: 20%;animation: float 3.6s ease-in-out infinite 1s; }

    /* ══════════ ДЕКОРАЦИИ: ЛЕПЕСТКИ ══════════ */
    .petal {
      position: fixed;
      width: 8px; height: 8px;
      background: #ffb6c1;
      z-index: 0; pointer-events: none;
      opacity: .55;
      animation: petals linear infinite;
    }
    .petal:nth-child(1)  { left: 8%;  animation-duration: 9s;  animation-delay: 0s;   width: 6px; height: 6px; }
    .petal:nth-child(2)  { left: 22%; animation-duration: 11s; animation-delay: 2s;   width: 10px; height: 10px; opacity: .35; }
    .petal:nth-child(3)  { left: 38%; animation-duration: 8s;  animation-delay: 4s; }
    .petal:nth-child(4)  { left: 52%; animation-duration: 10s; animation-delay: 1s;   width: 6px; height: 6px;
